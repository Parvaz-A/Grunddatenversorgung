<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AVG – UI Requirements (DATNETAV-845) Klickdummy</title>
<style>
  :root{
    --primary:#1565c0;
    --primary-dark:#0d47a1;
    --primary-light:#e3f2fd;
    --accent:#00897b;
    --bg:#f4f6f8;
    --panel:#ffffff;
    --border:#dfe3e8;
    --text:#1c2733;
    --text-muted:#647184;
    --ok:#2e7d32;
    --ok-bg:#e8f5e9;
    --warn:#b26a00;
    --warn-bg:#fff3e0;
    --err:#c62828;
    --err-bg:#fdecea;
    --info:#0d47a1;
    --info-bg:#e3f2fd;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Roboto","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  header.app{
    background:var(--primary-dark);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:baseline;
    gap:14px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header.app h1{font-size:17px;margin:0;font-weight:500;letter-spacing:.2px;}
  header.app .ticket{font-size:12px;opacity:.8;font-family:monospace;}
  header.app .env{margin-left:auto;font-size:11px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;}

  nav.tabs{
    display:flex;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    position:sticky;top:0;z-index:20;
  }
  nav.tabs button{
    appearance:none;border:none;background:none;
    padding:13px 18px;
    font-size:13px;
    font-family:inherit;
    color:var(--text-muted);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--primary);background:var(--primary-light);}
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}

  .breadcrumb{
    padding:9px 26px;font-size:12px;color:var(--text-muted);background:#fbfcfd;
    border-bottom:1px solid var(--border);
  }
  .breadcrumb .sep{margin:0 6px;color:#c3cad2;}
  .breadcrumb .current{color:var(--text);font-weight:500;}

  .dl-wrap{position:relative;display:inline-block;}
  .dl-menu{
    display:none;position:absolute;top:100%;right:0;margin-top:4px;background:#fff;
    border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.14);
    min-width:230px;z-index:40;overflow:hidden;
  }
  .dl-menu.show{display:block;}
  .dl-menu div{padding:10px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .dl-menu div:hover{background:var(--primary-light);color:var(--primary);}

  .mini-stepper{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap;}
  .mini-stepper .step{padding:3px 8px;border-radius:10px;background:#eceff1;color:var(--text-muted);}
  .mini-stepper .step.ok{background:var(--ok-bg);color:var(--ok);}
  .mini-stepper .step.err{background:var(--err-bg);color:var(--err);font-weight:600;}
  .mini-stepper .step.pending{background:#eceff1;color:#9aa4b0;}
  .mini-stepper .arrow{color:#c3cad2;}

  main{padding:22px 32px 60px;max-width:none;margin:0;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:18px;
  }
  .panel h2{font-size:15px;margin:0 0 4px;font-weight:500;}
  .panel .sub{color:var(--text-muted);font-size:12.5px;margin:0 0 16px;line-height:1.5;}
  .tabview{display:none;}
  .tabview.active{display:block;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .search{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);border-radius:20px;padding:6px 12px;background:#fbfbfc;min-width:220px;
  }
  .toolbar .search input{border:none;outline:none;background:none;font-size:13px;flex:1;font-family:inherit;}
  .spacer{flex:1;}

  button.btn{
    font-family:inherit;font-size:12.5px;font-weight:500;
    border-radius:4px;border:1px solid transparent;padding:8px 16px;
    cursor:pointer;letter-spacing:.2px;
  }
  button.btn.primary{background:var(--primary);color:#fff;}
  button.btn.primary:hover{background:var(--primary-dark);}
  button.btn.ghost{background:none;border-color:var(--border);color:var(--text);}
  button.btn.ghost:hover{border-color:var(--primary);color:var(--primary);}
  button.btn.danger-ghost{background:none;border-color:var(--border);color:var(--err);}
  button.btn.danger-ghost:hover{border-color:var(--err);background:var(--err-bg);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{
    text-align:left;padding:9px 10px;background:#f7f8fa;color:var(--text-muted);
    font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--border);position:relative;white-space:nowrap;
  }
  table.data th.sortable{cursor:pointer;user-select:none;}
  table.data th.sortable:hover{color:var(--primary);}
  table.data td{padding:9px 10px;border-bottom:1px solid #eef0f2;vertical-align:middle;}
  table.data tbody tr:hover{background:#fafcff;}
  table.data tr.selected{background:var(--primary-light);}
  .col-actions{white-space:nowrap;text-align:right;}

  .chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:500;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.err{background:var(--err-bg);color:var(--err);}
  .chip.info{background:var(--info-bg);color:var(--info);}
  .chip.neutral{background:#eceff1;color:#546070;}

  .pagination{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--text-muted);font-size:12.5px;}
  .pagination select{font-family:inherit;font-size:12.5px;border:1px solid var(--border);border-radius:4px;padding:4px 6px;}
  .pagination button{border:1px solid var(--border);background:#fff;border-radius:4px;padding:4px 9px;cursor:pointer;}
  .pagination button:disabled{opacity:.4;cursor:not-allowed;}

  .layout-split{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start;}
  @media(max-width:1000px){.layout-split{grid-template-columns:1fr;}}
  .layout-split-routen{display:grid;grid-template-columns:minmax(0,880px) 1fr;gap:18px;align-items:start;}
  @media(max-width:1300px){.layout-split-routen{grid-template-columns:1fr;}}

  .field-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field-row label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .field-row input[type=text],.field-row input[type=number],.field-row input[type=date],.field-row select{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:4px;outline:none;
  }
  .field-row input:focus,.field-row select:focus{border-color:var(--primary);}
  .field-row.checkbox{flex-direction:row;align-items:center;}
  .field-row.checkbox input{margin-right:8px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .autocomplete{position:relative;}
  .autocomplete .results{
    position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);
    border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:30;display:none;
  }
  .autocomplete .results.show{display:block;}
  .autocomplete .results div{padding:8px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f2f2f2;}
  .autocomplete .results div:hover{background:var(--primary-light);}
  .autocomplete .results div b{color:var(--primary);}

  .radio-group{display:flex;gap:18px;margin-bottom:16px;}
  .radio-option{
    border:1px solid var(--border);border-radius:6px;padding:12px 16px;flex:1;cursor:pointer;
    display:flex;align-items:flex-start;gap:10px;
  }
  .radio-option.selected{border-color:var(--primary);background:var(--primary-light);}
  .radio-option input{margin-top:2px;}
  .radio-option .lbl{font-weight:500;font-size:13px;}
  .radio-option .desc{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .route-header-card{background:#fbfcfe;border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
  .empty-state{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:13px;}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:8px;padding:22px 24px;width:480px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 4px;font-size:15px;}
  .modal .sub{color:var(--text-muted);font-size:12px;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .badge-tab-count{background:#eceff1;color:var(--text-muted);border-radius:10px;padding:1px 7px;font-size:10.5px;margin-left:6px;}
  .note-banner{background:var(--warn-bg);border:1px solid #ffe0b2;color:var(--warn);border-radius:6px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}

  .errorlog-header{
    display:grid;grid-template-columns:22px 1.6fr 1.1fr 0.8fr 0.9fr 1fr;
    align-items:center;gap:10px;padding:9px 16px;
    background:#f7f8fa;color:var(--text-muted);font-weight:500;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);
  }
  .errorlog-list{display:flex;flex-direction:column;}
  .errorlog-item{border-bottom:1px solid var(--border);background:#fff;}
  .errorlog-item:last-child{border-bottom:none;}
  .errorlog-item.handled{opacity:.7;}
  .errorlog-row{
    display:grid;grid-template-columns:22px 1.6fr 1.1fr 0.8fr 0.9fr 1fr;
    align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-size:13px;
  }
  .errorlog-row:hover{background:#fafbfc;}
  .errorlog-item.open .errorlog-row{background:var(--primary-light);}
  .errorlog-caret{color:#8a94a3;font-size:11px;}
  .errorlog-type{font-weight:500;}
  .errorlog-meta{color:var(--text-muted);font-size:12.5px;}
  .errorlog-link{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.4px;text-align:right;}
  .errorlog-detail{
    padding:16px 20px 20px 48px;background:#fafbfc;border-top:1px solid var(--border);
  }
  .errorlog-detail-text{font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.5;}
  .errorlog-fix{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px 2px;max-width:420px;}
  .errorlog-fix .field-row{margin-bottom:14px;}
  .errorlog-fix .field-row label{font-size:11.5px;}
  .errorlog-fix .field-row input{width:100%;}
  .errorlog-fix .field-grid{max-width:none;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#26313f;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .footer-note{color:var(--text-muted);font-size:11.5px;text-align:center;margin-top:20px;}
</style>
</head>

function sortRows(rows, key, dir){
  return rows.slice().sort((a,b)=>{
    let va=a[key], vb=b[key];

    if(va==='' && vb!=='') return 1*dir;
    if(vb==='' && va!=='') return -1*dir;
    return String(va).localeCompare(String(vb),'de',{numeric:true})*dir;
  });
}

/* ============================= HELPERS ============================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}
function openModal(html){
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
}
document.getElementById('modalBackdrop').addEventListener('click',e=>{
  if(e.target.id==='modalBackdrop') closeModal();
});
function statusChip(status){
  const map={
    "routendetection_laeuft":["info","Routenerkennung läuft"],
    "fertig":["ok","Fertig"],
    "neue_routen":["warn","Neue Routen"],
    "fehler":["err","Fehler"],
    "bereit":["ok","Abgeschlossen"],
    "archiv_wird_erstellt":["info","Archiv wird erstellt"],
    "archiv_erstellt":["ok","Abgeschlossen"],
    "upload_laeuft":["info","Upload läuft"],
    "abgeschlossen":["ok","Abgeschlossen"],
  };
  const [cls,label]=map[status]||["neutral",status];
  return `<span class="chip ${cls}">${label}</span>`;
}
function archiveOptions(status, i){
  if(status==="routendetection_laeuft") return `<button class="btn small ghost" disabled>Routenerkennung läuft…</button>`;
  if(status==="fertig" || status==="bereit"){
    return `<button class="btn small primary" onclick="startArchiveCreation(${i})">Archiv erstellen</button>`;
  }
  if(status==="neue_routen"){
    return `
      <button class="btn small primary" onclick="goToRoutenConfig(${i})">Routen konfigurieren</button>
      <button class="btn small ghost" style="margin-left:6px;" onclick="markRoutesConfigured(${i})">Konfiguriert</button>
    `;
  }
  if(status==="fehler"){
    return `<button class="btn small danger-ghost" onclick="renderErrorLogModal(${i})">Details ansehen</button>`;
  }
  if(status==="archiv_wird_erstellt") return `<button class="btn small ghost" disabled>Archiv wird erstellt…</button>`;
  if(status==="archiv_erstellt") return `<button class="btn small ghost" disabled>Upload wird gestartet…</button>`;
  if(status==="upload_laeuft") return `<button class="btn small ghost" disabled>Upload läuft…</button>`;
  if(status==="abgeschlossen"){
    return `
      <div class="dl-wrap">
        <button class="btn small ghost" onclick="toggleDownloadMenu(${i})">Herunterladen ▾</button>
        <div class="dl-menu" id="dlMenu_${i}">
          <div onclick="downloadArchive(${i},'gesamt')">Alle Routen</div>
          <div onclick="downloadArchive(${i},'neue_routen')">Neue Routen</div>
        </div>
      </div>
    `;
  }
  return "";
}
function toggleDownloadMenu(i){
  document.querySelectorAll('.dl-menu').forEach(m=>{ if(m.id!=='dlMenu_'+i) m.classList.remove('show'); });
  document.getElementById('dlMenu_'+i).classList.toggle('show');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.dl-wrap')) document.querySelectorAll('.dl-menu').forEach(m=>m.classList.remove('show'));
});
function downloadArchive(i, type){
  document.querySelectorAll('.dl-menu').forEach(m=>m.classList.remove('show'));
  toast(type==='gesamt' ? 'Download „Alle Routen" gestartet (Demo)' : 'Download „Neue Routen" gestartet (Demo)');
}
function statusCell(r){
  const warn = r.hasSkippedError ? `<span class="chip warn" style="margin-left:6px;" title="Ein externer Fahrplanfehler wurde übersprungen und ist weiterhin offen">⚠ Fehler vorhanden</span>` : '';
  return statusChip(r.status) + warn;
}
function renderErrorLogModal(i){
  const r=archiveRows[i];
  const allHandled = r.errorLog.every(e=>e.resolved||e.skipped);
  openModal(`
    <h3>Error-Log</h3>
    <p class="sub">${r.datum} · ${r.typ} · ${r.parameter}</p>
    <p class="sub" style="margin-bottom:14px;">Die Routenerkennung hat folgende Fehler gefunden:</p>
    ${r.errorLog.map((e,j)=>`
      <div style="border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;${e.resolved?'opacity:.55;':e.skipped?'opacity:.8;':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <div style="font-weight:500;font-size:13px;">
              ${e.type}
              ${e.external?' <span class="chip neutral" style="margin-left:4px;">Extern</span>':''}
              ${e.tabLabel?` <span class="chip info" style="margin-left:4px;" title="Wird im Tab „${e.tabLabel}“ korrigiert">Tab: ${e.tabLabel}</span>`:''}
            </div>
            <div class="sub" style="margin:2px 0 0;">${e.detail}</div>
          </div>
          <div style="white-space:nowrap;">
            ${e.resolved ? '<span class="chip ok">Behoben</span>' :
              e.skipped ? '<span class="chip warn">Übersprungen</span>' :
              e.external ? `<button class="btn small ghost" onclick="skipSingleError(${i},${j})">Überspringen</button>` :
              `<button class="btn small primary" onclick="goToErrorTab(${i},${j})">Zu ${e.tabLabel} springen</button>`}
          </div>
        </div>
      </div>
    `).join('')}
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Schließen</button>
      ${allHandled ? `<button class="btn primary" onclick="finishErrorHandling(${i})">Weiter</button>` : ''}
    </div>
  `);
}
function goToErrorTab(i,j){
  const e=archiveRows[i].errorLog[j];
  closeModal();
  selectTab(e.tab);
  e.resolved=true;
  toast(`Zu „${e.tabLabel}“ gesprungen – ${e.type} als korrigiert markiert (Demo)`);
}
function skipSingleError(i,j){
  const e=archiveRows[i].errorLog[j];
  openModal(`
    <h3>Sind Sie sicher?</h3>
    <p class="sub">„${e.type}" wird als externer Fahrplanfehler übersprungen. Der Fehler bleibt auch nach Archiverstellung in der Tabelle sichtbar markiert.</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="renderErrorLogModal(${i})">Abbrechen</button>
      <button class="btn primary" onclick="confirmSkipSingleError(${i},${j})">Ja, überspringen</button>
    </div>
  `);
}
function confirmSkipSingleError(i,j){
  archiveRows[i].errorLog[j].skipped=true;
  renderErrorLogModal(i);
  toast('Fehler übersprungen – bleibt markiert');
}
function finishErrorHandling(i){
  const r=archiveRows[i];
  r.hasSkippedError = r.errorLog.some(e=>e.skipped);
  r.status='bereit';
  closeModal();
  renderArchiv();
  toast(r.hasSkippedError ? 'Fehler bearbeitet – ein Fahrplanfehler bleibt markiert' : 'Alle Fehler behoben – Status: Abgeschlossen');
}
function goToRoutenConfig(i){
  selectTab('routen');
  toast('Zu Routen konfigurieren gesprungen (Demo) – betroffene Route markiert');
}
function markRoutesConfigured(i){
  archiveRows[i].status='bereit';
  renderArchiv();
  toast('Routen konfiguriert – Status: Abgeschlossen');
}

/* ============================= TAB: ERROR LOGS ============================= */
let errorLogExpanded = new Set();
function renderErrorLogs(){
  const el=document.getElementById('view-errorlogs');
  const rows=[];
  archiveRows.forEach((r,i)=>{ if(r.errorLog) r.errorLog.forEach((e,j)=>rows.push({i,j,e,r})); });
  el.innerHTML=`
    <div class="panel">
      <h2>Error Logs</h2>
      <p class="sub">Alle von der Routenerkennung gefundenen Fehler, archivübergreifend. Zeile öffnen und direkt korrigieren.</p>
      ${rows.length===0 ? `<div class="empty-state">Aktuell keine Fehler vorhanden.</div>` : `
      <div class="errorlog-header">
        <span></span>
        <span>Fehlertyp</span>
        <span>Archiv</span>
        <span>Ziel-Tab</span>
        <span>Status</span>
        <span></span>
      </div>
      <div class="errorlog-list">
        ${rows.map(({i,j,e,r})=>{
          const key=i+'-'+j;
          const open=errorLogExpanded.has(key);
          const handled = e.resolved||e.skipped;
          const statusChipHtml = e.resolved?'<span class="chip ok">✓ Behoben</span>':e.skipped?'<span class="chip warn">Übersprungen</span>':'<span class="chip err">Offen</span>';
          return `
          <div class="errorlog-item ${open?'open':''} ${handled?'handled':''}">
            <div class="errorlog-row" onclick="toggleErrorLogRow('${key}')">
              <span class="errorlog-caret">${open?'▲':'▼'}</span>
              <span class="errorlog-type">${e.type}${e.external?' <span class="chip neutral">Extern</span>':''}</span>
              <span class="errorlog-meta">${r.datum} · ${r.typ}</span>
              <span class="errorlog-meta">${e.tabLabel||'—'}</span>
              <span class="errorlog-status">${statusChipHtml}</span>
              <span class="errorlog-link">${handled?'':'FEHLER ANZEIGEN'}</span>
            </div>
            ${open?`
            <div class="errorlog-detail">
              <div class="errorlog-detail-text">${e.detail}</div>
              ${e.resolved?`<div class="chip ok">Bereits behoben</div>`:
                e.skipped?`<div class="chip warn">Bereits übersprungen – bleibt markiert</div>`:
                e.external?`
                  <p class="hint" style="margin:0 0 10px;">Diese Korrektur erfolgt in einem externen System und kann hier nicht direkt bearbeitet werden.</p>
                  <button class="btn small ghost" onclick="skipErrorFromLogs(${i},${j})">Überspringen</button>
                `:
                `
                <div class="errorlog-fix">${getInlineFixFields(e,i,j)}</div>
                <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
                  <button class="btn small primary" onclick="saveInlineCorrection(${i},${j})">Korrigieren &amp; Speichern</button>
                  <button class="btn small ghost" onclick="goToErrorTabFromLogs(${i},${j})">Stattdessen in ${e.tabLabel} bearbeiten</button>
                </div>
                `}
            </div>`:''}
          </div>
          `;
        }).join('')}
      </div>
      `}
    </div>
  `;
}
function getInlineFixFields(e,i,j){
  const id=`fix_${i}_${j}`;
  if(e.type==="Missing Distances"){
    return `<div class="field-row"><label>Distanz zur nächsten Station (Meter)</label><input type="number" min="0" id="${id}" placeholder="z. B. 850"></div>`;
  }
  if(e.type==="Missing LineNumber"){
    return `<div class="field-row"><label>Liniennummer</label><input type="text" id="${id}" placeholder="z. B. S71"></div>`;
  }
  if(e.type==="Missing Station Coordinates"){
    return `<div class="field-grid">
      <div class="field-row"><label>Breitengrad (Lat)</label><input type="text" id="${id}_lat" placeholder="z. B. 48.8586"></div>
      <div class="field-row"><label>Längengrad (Lon)</label><input type="text" id="${id}_lon" placeholder="z. B. 8.3599"></div>
    </div>`;
  }
  if(e.type==="Missing Announcement"){
    return `
      <div class="field-row">
        <label>Ansage zuordnen</label>
        <div class="autocomplete">
          <input type="text" id="${id}" placeholder="Ansage suchen…" oninput="showFixAnsageResults(${i},${j},this.value)" onfocus="showFixAnsageResults(${i},${j},this.value)">
          <div class="results" id="${id}_results"></div>
        </div>
      </div>`;
  }
  return `<div class="field-row"><label>Wert</label><input type="text" id="${id}" placeholder="Korrektur eingeben…"></div>`;
}
function showFixAnsageResults(i,j,q){
  const box=document.getElementById(`fix_${i}_${j}_results`);
  const matches=ansageOptions.filter(a=>a.num.includes(q)||a.text.toLowerCase().includes((q||'').toLowerCase()));
  box.innerHTML=matches.map(a=>`<div onclick="pickFixAnsage(${i},${j},'${a.num}','${a.text.replace(/'/g,"\\'")}')"><b>${a.num}</b> — ${a.text}</div>`).join('') || `<div style="color:#9aa4b0">Keine Treffer</div>`;
  box.classList.add('show');
}
function pickFixAnsage(i,j,num,text){
  document.getElementById(`fix_${i}_${j}`).value = num+" – "+text;
  document.getElementById(`fix_${i}_${j}_results`).classList.remove('show');
}
function saveInlineCorrection(i,j){
  const e=archiveRows[i].errorLog[j];
  const id=`fix_${i}_${j}`;
  if(e.type==="Missing Station Coordinates"){
    const lat=document.getElementById(id+'_lat').value, lon=document.getElementById(id+'_lon').value;
    if(!lat||!lon){ toast('Bitte beide Koordinaten eingeben'); return; }
  } else {
    const val=document.getElementById(id)?.value;
    if(!val){ toast('Bitte einen Wert eingeben'); return; }
  }
  e.resolved=true;
  renderErrorLogs();
  renderArchiv();
  toast(e.type+' korrigiert und gespeichert');
}
function toggleErrorLogRow(key){
  if(errorLogExpanded.has(key)) errorLogExpanded.delete(key); else errorLogExpanded.add(key);
  renderErrorLogs();
}
function goToErrorTabFromLogs(i,j){
  goToErrorTab(i,j);
}
function skipErrorFromLogs(i,j){
  const e=archiveRows[i].errorLog[j];
  openModal(`
    <h3>Sind Sie sicher?</h3>
    <p class="sub">„${e.type}" wird als externer Fahrplanfehler übersprungen. Der Fehler bleibt in der Liste sichtbar markiert.</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="confirmSkipErrorFromLogs(${i},${j})">Ja, überspringen</button>
    </div>
  `);
}
function confirmSkipErrorFromLogs(i,j){
  archiveRows[i].errorLog[j].skipped=true;
  closeModal();
  renderErrorLogs();
  renderArchiv();
  toast('Fehler übersprungen – bleibt markiert');
}

function startArchive(){
  const version=document.getElementById('version').value;
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  const isIBIS = selectedTyp==='IBIS';
  const param = isIBIS ? `${version} · Zeitraum ${from}–${to}` : 'wartet auf IBIS-Export';
  const now=new Date();
  archiveRows.unshift({
    datum: now.toLocaleDateString('de-DE')+" "+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),
    typ:selectedTyp, status: isIBIS ? 'routendetection_laeuft' : 'archiv_wird_erstellt', parameter: param
  });
  renderArchiv();
  toast(isIBIS ? 'Routenerkennung gestartet (Demo)' : 'Archiverstellung gestartet (Demo)');
  const idx=0;
  if(isIBIS){
    setTimeout(()=>{
      const outcomes=['fertig','neue_routen','fehler'];
      const outcome=outcomes[Math.floor(Math.random()*outcomes.length)];
      archiveRows[idx].status=outcome;
      if(outcome==='fehler'){
        archiveRows[idx].errorLog=[
          {type:"Missing Distances", detail:"Route 56.104: Distanz zwischen zwei Stationen fehlt.", external:false, resolved:false, skipped:false, tab:"routen", tabLabel:"Routen"},

          {type:"Missing Station Coordinates", detail:"Eine Station hat keine GPS-Koordinaten.", external:false, resolved:false, skipped:false, tab:"stationen", tabLabel:"Stationen"},
          {type:"Missing Schedule Data", detail:"Fahrplan-Release: Abfahrtszeiten unvollständig.", external:true, resolved:false, skipped:false, tab:null, tabLabel:null},
          {type:"Missing Announcement", detail:"Eine Station hat keine Ansage zugeordnet.", external:false, resolved:false, skipped:false, tab:"ansagen", tabLabel:"Ansagen"},
        ];
      }
      renderArchiv();
      toast('Routenerkennung abgeschlossen: '+(outcome==='fertig'?'Fertig – keine neuen Routen':outcome==='neue_routen'?'Neue Routen erkannt':'Fehler erkannt'));
    }, 1800);
  } else {
    setTimeout(()=>{ archiveRows[idx].status='archiv_erstellt'; renderArchiv(); }, 1400);

    setTimeout(()=>{ archiveRows[idx].status='abgeschlossen'; renderArchiv(); toast('Upload erfolgreich – Archiv abgeschlossen'); }, 3600);
  }
}

  setTimeout(()=>{ archiveRows[i].status='abgeschlossen'; renderArchiv(); toast('Upload erfolgreich – Archiv abgeschlossen'); }, 3600);
}

    <div class="field-row">
      <label>Gattung</label>
      <select id="d_gattung"><option ${r.gattung==='S'?'selected':''}>S</option><option ${r.gattung==='E'?'selected':''}>E</option></select>
    </div>
    <div class="field-row"><label>Linie</label><input type="text" id="d_linie" value="${r.linie}"></div>
    <div class="field-row"><label>Zielstation</label><input type="text" id="d_ziel" value="${r.ziel}"></div>
    <div class="field-row">
      <label>Zielcode</label>
      <div class="autocomplete">
        <input type="text" id="d_code" value="${r.code}" oninput="showZielResults('dispoZielResults', this.value)" onfocus="showZielResults('dispoZielResults', this.value)">
        <div class="results" id="dispoZielResults"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="saveDispo(${i===null?'null':i})">Speichern</button>
    </div>
  `);
}
function saveDispo(i){
  const data={
    gattung:document.getElementById('d_gattung').value,
    linie:document.getElementById('d_linie').value,
    ziel:document.getElementById('d_ziel').value,
    code:document.getElementById('d_code').value.split(' – ')[0],
  };
  if(i===null || i==='null') dispoRows.unshift(data); else dispoRows[i]=data;
  closeModal(); renderDispo(); toast('Eintrag gespeichert');
}
function deleteDispo(i){ dispoRows.splice(i,1); renderDispo(); toast('Eintrag gelöscht'); }
renderDispo();

/* ============================= TAB 9: PARAMETER ============================= */
function renderParameter(){
  const el=document.getElementById('view-parameter');
  const q=(document.getElementById('paramSearch')?.value||'').toLowerCase();
  const rows=parameterRows.filter(r=>r.name.toLowerCase().includes(q));
  el.innerHTML=`
    <div class="panel">
      <h2>Parameterarchiv</h2>
      <p class="sub">Konfiguration der INIT-Fahrzeugsoftware-Parameter. Jedes neue Software-Release kann neue Parameter oder Werte mitbringen; nicht alle sind durch AVG editierbar.</p>
      <div class="toolbar"><div class="search autocomplete">🔎 <input id="paramSearch" placeholder="Parameter suchen…" oninput="renderParameter();showParamSuggest(this.value)" onfocus="showParamSuggest(this.value)">
        <div class="results" id="paramSuggest"></div>
      </div></div>
      <table class="data">
        <thead><tr><th>Parameter</th><th>Wert</th><th>Editierbar</th><th>Release</th><th class="col-actions"></th></tr></thead>
        <tbody>
        ${rows.map(r=>`
          <tr>
            <td><code>${r.name}</code></td>
            <td>${r.editable ? `<input type="text" value="${r.wert}" style="width:90px" onchange="updateParam('${r.name}', this.value)">` : r.wert}</td>
            <td>${r.editable?'<span class="chip ok">Ja</span>':'<span class="chip neutral">Nein</span>'}</td>
            <td>${r.release}</td>
            <td class="col-actions">${r.editable?`<button class="btn small ghost" onclick="toast('Parameter gespeichert')">Speichern</button>`:''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function updateParam(name, val){
  const p=parameterRows.find(r=>r.name===name);
  p.wert=val;
}
renderParameter();

/* ============================= SUCH-VORSCHLÄGE (alle Suchfelder) ============================= */
function renderSuggestBox(boxId, items, query){
  const box=document.getElementById(boxId);
  if(!box) return;
  const q=(query||'').trim();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const shown=items.slice(0,8);
  box.innerHTML = shown.length ? shown.join('') : `<div style="color:#9aa4b0">Keine Treffer</div>`;
  box.classList.add('show');
}
function showRouteSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=routesList.filter(r=>r.idRoute.includes(query)||r.bezeichnung.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickRouteSuggest('${r.idRoute}')"><b>${r.idRoute}</b> — ${r.bezeichnung}</div>`);
  renderSuggestBox('routeSuggest', matches, q);
}
function pickRouteSuggest(idRoute){
  document.getElementById('routeSearch').value=idRoute;
  document.getElementById('routeSuggest').classList.remove('show');
  renderRouten();
}
function showStationSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=stationenRows.filter(r=>r.id.toLowerCase().includes(query)||r.name.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickStationSuggest('${r.id}')"><b>${r.id}</b> — ${r.name}</div>`);
  renderSuggestBox('stationSuggest', matches, q);
}
function pickStationSuggest(id){
  document.getElementById('stationSearch').value=id;
  document.getElementById('stationSuggest').classList.remove('show');
  renderStationen();
}
function showZcSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=zielcodeRows.filter(r=>r.code.includes(query)||r.zielText.toLowerCase().includes(query)||r.linieText.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickZcSuggest('${r.code}')"><b>${r.code}</b> — ${r.linieText} · ${r.zielText}</div>`);
  renderSuggestBox('zcSuggest', matches, q);
}
function pickZcSuggest(code){
  document.getElementById('zcSearch').value=code;
  document.getElementById('zcSuggest').classList.remove('show');
  renderZielcodes();
}
function showLongSuggest(viewId, q){
  const map = viewId==='view-zieltexte' ? zieltexteRows : linientexteRows;
  const query=(q||'').toLowerCase();
  const matches=map.filter(r=>r.nummer.includes(query)||(r.text||'').toLowerCase().includes(query)).slice(0,50)
    .map(r=>`<div onclick="pickLongSuggest('${viewId}','${r.nummer}')"><b>${r.nummer}</b> — ${r.text||'— leer —'}</div>`);
  renderSuggestBox(viewId+'_suggest', matches, q);
}
function pickLongSuggest(viewId, nummer){
  document.getElementById(viewId+'_search').value=nummer;
  document.getElementById(viewId+'_suggest').classList.remove('show');
  if(viewId==='view-zieltexte') renderZieltexte(); else renderLinientexte();
}
function showDispoSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=dispoRows.filter(r=>r.linie.toLowerCase().includes(query)||r.ziel.toLowerCase().includes(query)||r.code.includes(query))
    .map(r=>`<div onclick="pickDispoSuggest('${r.code}')"><b>${r.code}</b> — ${r.linie} · ${r.ziel}</div>`);
  renderSuggestBox('dispoSuggest', matches, q);
}
function pickDispoSuggest(code){
  document.getElementById('dispoSearch').value=code;
  document.getElementById('dispoSuggest').classList.remove('show');
  renderDispo();
}
function showParamSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=parameterRows.filter(r=>r.name.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickParamSuggest('${r.name}')">${r.name}</div>`);
  renderSuggestBox('paramSuggest', matches, q);
}
function pickParamSuggest(name){
  document.getElementById('paramSearch').value=name;
  document.getElementById('paramSuggest').classList.remove('show');
  renderParameter();
}
</script>
</body>
</html>
