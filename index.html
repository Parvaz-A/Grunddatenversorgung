<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AVG – UI Requirements (DATNETAV-845) Klickdummy</title>
<style>
  :root{
    --primary:#1565c0;
    --primary-dark:#0d47a1;
    --primary-light:#e3f2fd;
    --accent:#00897b;
    --bg:#f4f6f8;
    --panel:#ffffff;
    --border:#dfe3e8;
    --text:#1c2733;
    --text-muted:#647184;
    --ok:#2e7d32;
    --ok-bg:#e8f5e9;
    --warn:#b26a00;
    --warn-bg:#fff3e0;
    --err:#c62828;
    --err-bg:#fdecea;
    --info:#0d47a1;
    --info-bg:#e3f2fd;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Roboto","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  header.app{
    background:var(--primary-dark);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:baseline;
    gap:14px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header.app h1{font-size:17px;margin:0;font-weight:500;letter-spacing:.2px;}
  header.app .ticket{font-size:12px;opacity:.8;font-family:monospace;}
  header.app .env{margin-left:auto;font-size:11px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;}

  nav.tabs{
    display:flex;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    position:sticky;top:0;z-index:20;
  }
  nav.tabs button{
    appearance:none;border:none;background:none;
    padding:13px 18px;
    font-size:13px;
    font-family:inherit;
    color:var(--text-muted);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--primary);background:var(--primary-light);}
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}

  main{padding:22px 32px 60px;max-width:none;margin:0;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:18px;
  }
  .panel h2{font-size:15px;margin:0 0 4px;font-weight:500;}
  .panel .sub{color:var(--text-muted);font-size:12.5px;margin:0 0 16px;line-height:1.5;}
  .tabview{display:none;}
  .tabview.active{display:block;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .search{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);border-radius:20px;padding:6px 12px;background:#fbfbfc;min-width:220px;
  }
  .toolbar .search input{border:none;outline:none;background:none;font-size:13px;flex:1;font-family:inherit;}
  .spacer{flex:1;}

  button.btn{
    font-family:inherit;font-size:12.5px;font-weight:500;
    border-radius:4px;border:1px solid transparent;padding:8px 16px;
    cursor:pointer;letter-spacing:.2px;
  }
  button.btn.primary{background:var(--primary);color:#fff;}
  button.btn.primary:hover{background:var(--primary-dark);}
  button.btn.ghost{background:none;border-color:var(--border);color:var(--text);}
  button.btn.ghost:hover{border-color:var(--primary);color:var(--primary);}
  button.btn.danger-ghost{background:none;border-color:var(--border);color:var(--err);}
  button.btn.danger-ghost:hover{border-color:var(--err);background:var(--err-bg);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{
    text-align:left;padding:9px 10px;background:#f7f8fa;color:var(--text-muted);
    font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--border);position:relative;white-space:nowrap;
  }
  table.data th.sortable{cursor:pointer;user-select:none;}
  table.data th.sortable:hover{color:var(--primary);}
  table.data td{padding:9px 10px;border-bottom:1px solid #eef0f2;vertical-align:middle;}
  table.data tbody tr:hover{background:#fafcff;}
  table.data tr.selected{background:var(--primary-light);}
  .col-actions{white-space:nowrap;text-align:right;}

  .chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:500;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.err{background:var(--err-bg);color:var(--err);}
  .chip.info{background:var(--info-bg);color:var(--info);}
  .chip.neutral{background:#eceff1;color:#546070;}

  .pagination{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--text-muted);font-size:12.5px;}
  .pagination select{font-family:inherit;font-size:12.5px;border:1px solid var(--border);border-radius:4px;padding:4px 6px;}
  .pagination button{border:1px solid var(--border);background:#fff;border-radius:4px;padding:4px 9px;cursor:pointer;}
  .pagination button:disabled{opacity:.4;cursor:not-allowed;}

  .layout-split{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start;}
  @media(max-width:1000px){.layout-split{grid-template-columns:1fr;}}
  .layout-split-routen{display:grid;grid-template-columns:minmax(0,880px) 1fr;gap:18px;align-items:start;}
  @media(max-width:1300px){.layout-split-routen{grid-template-columns:1fr;}}

  .field-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field-row label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .field-row input[type=text],.field-row input[type=number],.field-row input[type=date],.field-row select{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:4px;outline:none;
  }
  .field-row input:focus,.field-row select:focus{border-color:var(--primary);}
  .field-row.checkbox{flex-direction:row;align-items:center;}
  .field-row.checkbox input{margin-right:8px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .autocomplete{position:relative;}
  .autocomplete .results{
    position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);
    border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:30;display:none;
  }
  .autocomplete .results.show{display:block;}
  .autocomplete .results div{padding:8px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f2f2f2;}
  .autocomplete .results div:hover{background:var(--primary-light);}
  .autocomplete .results div b{color:var(--primary);}

  .radio-group{display:flex;gap:18px;margin-bottom:16px;}
  .radio-option{
    border:1px solid var(--border);border-radius:6px;padding:12px 16px;flex:1;cursor:pointer;
    display:flex;align-items:flex-start;gap:10px;
  }
  .radio-option.selected{border-color:var(--primary);background:var(--primary-light);}
  .radio-option input{margin-top:2px;}
  .radio-option .lbl{font-weight:500;font-size:13px;}
  .radio-option .desc{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .route-header-card{background:#fbfcfe;border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
  .empty-state{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:13px;}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:8px;padding:22px 24px;width:480px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 4px;font-size:15px;}
  .modal .sub{color:var(--text-muted);font-size:12px;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .badge-tab-count{background:#eceff1;color:var(--text-muted);border-radius:10px;padding:1px 7px;font-size:10.5px;margin-left:6px;}
  .note-banner{background:var(--warn-bg);border:1px solid #ffe0b2;color:var(--warn);border-radius:6px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#26313f;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .footer-note{color:var(--text-muted);font-size:11.5px;text-align:center;margin-top:20px;}
</style>
</head>

function sortRows(rows, key, dir){
  return rows.slice().sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(typeof va==='boolean') return (Number(va)-Number(vb))*dir;
    if(va==='' && vb!=='') return 1*dir;
    if(vb==='' && va!=='') return -1*dir;
    return String(va).localeCompare(String(vb),'de',{numeric:true})*dir;
  });
}
function sortArrow(state, col){ return state.key!==col ? '' : `<span style="font-size:10px;margin-left:3px;">${state.dir===1?'▲':'▼'}</span>`; }

function genLongList(n, prefix){
  const arr=[];
  for(let i=1;i<=n;i++){
    arr.push({nummer:String(1000+i), text: i%37===0 ? "" : (prefix+" "+(1000+i))});

/* ============================= HELPERS ============================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}
function openModal(html){
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
}
document.getElementById('modalBackdrop').addEventListener('click',e=>{
  if(e.target.id==='modalBackdrop') closeModal();
});
function statusChip(status){
  const map={
    "erstellt":["neutral","Task erstellt"],
    "export_laeuft":["info","IBIS-Export läuft"],
    "pruefung_prod":["warn","Zur Prüfung Prod.-System"],
    "abgeschlossen":["ok","Abgeschlossen"],
    "fehler":["err","Fehlgeschlagen"],
    "freigegeben":["ok","Freigegeben"],
    "entwurf":["warn","Entwurf"],
  };
  const [cls,label]=map[status]||["neutral",status];
  return `<span class="chip ${cls}">${label}</span>`;
}
function archiveOptions(status){
  if(status==="erstellt") return `<button class="btn small ghost" disabled>läuft…</button>`;
  if(status==="export_laeuft") return `<button class="btn small ghost" disabled>Export läuft…</button>`;
  if(status==="pruefung_prod") return `<button class="btn small primary" onclick="approveArchive(this)">Prüfen &amp; freigeben</button>`;
  if(status==="abgeschlossen") return `<button class="btn small ghost" onclick="toast('Download gestartet (Demo)')">Herunterladen</button>`;
  if(status==="fehler") return `<button class="btn small danger-ghost" onclick="toast('Erneuter Export gestartet (Demo)')">Erneut versuchen</button>`;
  return "";
}

  {id:"dispo", label:"Zielcodes Dispo"},
  {id:"parameter", label:"Parameter"},
];

const nav=document.getElementById('tabNav');
TABS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.textContent=t.label;
  b.dataset.tab=t.id;
  if(i===0) b.classList.add('active');
  b.onclick=()=>selectTab(t.id);
  nav.appendChild(b);
});

function selectTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.tabview').forEach(v=>v.classList.toggle('active', v.id==='view-'+id));
}

const container=document.getElementById('tabContainer');
TABS.forEach(t=>{
  const div=document.createElement('div');
  div.className='tabview'+(t.id==='archiv'?' active':'');
  div.id='view-'+t.id;
  container.appendChild(div);
});

      <p class="sub">Reihenfolge der Audiofragmente je Ansagenummer. Nummern ab 110.001 sind Funktionsansagen mit fixer Nummer.</p>
      <div class="toolbar"><div class="spacer"></div><button class="btn primary" onclick="addPlaylistRow()">+ Fragment hinzufügen</button></div>
      <table class="data">
        <thead><tr><th>Nummer</th><th>Fragment</th><th>Dateiname</th><th class="col-actions"></th></tr></thead>
        <tbody>
          ${playlistRows.map((p,i)=>`
            <tr><td>${p.nummer}</td><td>${p.fragment}</td><td>${p.filename}</td>
              <td class="col-actions">
                <button class="btn small ghost" onclick="toast('Fragment bearbeitet (Demo)')">Bearbeiten</button>
                <button class="btn small danger-ghost" onclick="deletePlaylistRow(${i})">Löschen</button>
              </td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function addPlaylistRow(){
  playlistRows.push({nummer:"9.999", fragment: playlistRows.length+1, filename:"neue_datei.mp3"});
  renderAnsagen(); toast('Fragment hinzugefügt (Demo)');
}
function deletePlaylistRow(i){ playlistRows.splice(i,1); renderAnsagen(); toast('Fragment gelöscht'); }
renderAnsagen();

/* ============================= TAB 8: ZIELCODES DISPO ============================= */
function renderDispo(){
  const el=document.getElementById('view-dispo');
  const q=(document.getElementById('dispoSearch')?.value||'').toLowerCase();
  const rows=dispoRows.filter((r,i)=> r.linie.toLowerCase().includes(q)||r.ziel.toLowerCase().includes(q)||r.code.includes(q));
  el.innerHTML=`
    <div class="panel">
      <h2>Zielcodes für Dispositionsmaßnahmen</h2>
      <p class="sub">Wird von vehicle_interface genutzt, wenn sich der ursprüngliche Zielcode durch eine dispositive Änderung ändert. Ca. 30.000 Zeilen, alle Spalten editierbar.</p>
      <div class="toolbar">
        <div class="search">🔎 <input id="dispoSearch" placeholder="Suche Linie, Ziel, Code…" oninput="renderDispo()"></div>
        <div class="spacer"></div>
        <button class="btn primary" onclick="editDispo(null)">+ Neuer Eintrag</button>
      </div>
      <table class="data">
        <thead><tr><th>Gattung</th><th>Linie</th><th>Zielstation</th><th>Zielcode</th><th class="col-actions"></th></tr></thead>
        <tbody>
        ${rows.map((r)=>`
          <tr>
            <td>${r.gattung}</td><td>${r.linie}</td><td>${r.ziel}</td><td>${r.code}</td>
            <td class="col-actions">
              <button class="btn small ghost" onclick="editDispo(${dispoRows.indexOf(r)})">Bearbeiten</button>
              <button class="btn small danger-ghost" onclick="deleteDispo(${dispoRows.indexOf(r)})">Löschen</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="pagination">Zeile 1–${rows.length} von ca. 30.000
        <select><option>25 / Seite</option><option>50 / Seite</option></select>
        <button disabled>‹</button><button>›</button>
      </div>
    </div>
  `;
}
function editDispo(i){
  const r = i===null ? {gattung:"S",linie:"",ziel:"",code:""} : dispoRows[i];
  openModal(`
    <h3>${i===null?'Neuer Eintrag':'Eintrag bearbeiten'}</h3>
    <div class="field-row">
      <label>Gattung</label>
      <select id="d_gattung"><option ${r.gattung==='S'?'selected':''}>S</option><option ${r.gattung==='E'?'selected':''}>E</option></select>
    </div>
    <div class="field-row"><label>Linie</label><input type="text" id="d_linie" value="${r.linie}"></div>
    <div class="field-row"><label>Zielstation</label><input type="text" id="d_ziel" value="${r.ziel}"></div>
    <div class="field-row">
      <label>Zielcode</label>
      <div class="autocomplete">
        <input type="text" id="d_code" value="${r.code}" oninput="showZielResults('dispoZielResults', this.value)" onfocus="showZielResults('dispoZielResults', this.value)">
        <div class="results" id="dispoZielResults"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="saveDispo(${i===null?'null':i})">Speichern</button>
    </div>
  `);
}
function saveDispo(i){
  const data={
    gattung:document.getElementById('d_gattung').value,
    linie:document.getElementById('d_linie').value,
    ziel:document.getElementById('d_ziel').value,
    code:document.getElementById('d_code').value.split(' – ')[0],
  };
  if(i===null || i==='null') dispoRows.unshift(data); else dispoRows[i]=data;
  closeModal(); renderDispo(); toast('Eintrag gespeichert');
}
function deleteDispo(i){ dispoRows.splice(i,1); renderDispo(); toast('Eintrag gelöscht'); }
renderDispo();

/* ============================= TAB 9: PARAMETER ============================= */
function renderParameter(){
  const el=document.getElementById('view-parameter');
  const q=(document.getElementById('paramSearch')?.value||'').toLowerCase();
  const rows=parameterRows.filter(r=>r.name.toLowerCase().includes(q));
  el.innerHTML=`
    <div class="panel">
      <h2>Parameterarchiv</h2>
      <p class="sub">Konfiguration der INIT-Fahrzeugsoftware-Parameter. Jedes neue Software-Release kann neue Parameter oder Werte mitbringen; nicht alle sind durch AVG editierbar.</p>
      <div class="toolbar"><div class="search">🔎 <input id="paramSearch" placeholder="Parameter suchen…" oninput="renderParameter()"></div></div>
      <table class="data">
        <thead><tr><th>Parameter</th><th>Wert</th><th>Editierbar</th><th>Release</th><th class="col-actions"></th></tr></thead>
        <tbody>
        ${rows.map(r=>`
          <tr>
            <td><code>${r.name}</code></td>
            <td>${r.editable ? `<input type="text" value="${r.wert}" style="width:90px" onchange="updateParam('${r.name}', this.value)">` : r.wert}</td>
            <td>${r.editable?'<span class="chip ok">Ja</span>':'<span class="chip neutral">Nein</span>'}</td>
            <td>${r.release}</td>
            <td class="col-actions">${r.editable?`<button class="btn small ghost" onclick="toast('Parameter gespeichert')">Speichern</button>`:''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function updateParam(name, val){
  const p=parameterRows.find(r=>r.name===name);
  p.wert=val;
}
renderParameter();
</script>
</body>
</html>
