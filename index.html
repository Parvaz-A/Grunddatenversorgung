<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVG – UI Requirements (DATNETAV-845) Klickdummy</title>
<style>
  :root{
    --primary:#1565c0;
    --primary-dark:#0d47a1;
    --primary-light:#e3f2fd;
    --accent:#00897b;
    --bg:#f4f6f8;
    --panel:#ffffff;
    --border:#dfe3e8;
    --text:#1c2733;
    --text-muted:#647184;
    --ok:#2e7d32;
    --ok-bg:#e8f5e9;
    --warn:#b26a00;
    --warn-bg:#fff3e0;
    --err:#c62828;
    --err-bg:#fdecea;
    --info:#0d47a1;
    --info-bg:#e3f2fd;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Roboto","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  header.app{
    background:var(--primary-dark);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:baseline;
    gap:14px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header.app h1{font-size:17px;margin:0;font-weight:500;letter-spacing:.2px;}
  header.app .ticket{font-size:12px;opacity:.8;font-family:monospace;}
  header.app .env{margin-left:auto;font-size:11px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;}

  nav.tabs{
    display:flex;
    flex-wrap:nowrap;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    position:sticky;top:0;z-index:20;
  }
  nav.tabs button{
    appearance:none;border:none;background:none;
    padding:12px 10px;
    font-size:11.5px;
    font-family:inherit;
    color:var(--text-muted);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    flex-shrink:0;
  }
  nav.tabs button:hover{color:var(--primary);background:var(--primary-light);}
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}

  .breadcrumb{
    padding:9px 26px;font-size:12px;color:var(--text-muted);background:#fbfcfd;
    border-bottom:1px solid var(--border);
  }
  .breadcrumb .sep{margin:0 6px;color:#c3cad2;}
  .breadcrumb .current{color:var(--text);font-weight:500;}

  .dl-wrap{position:relative;display:inline-block;}
  .dl-menu{
    display:none;position:absolute;top:100%;right:0;margin-top:4px;background:#fff;
    border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.14);
    min-width:140px;z-index:40;overflow:hidden;
  }
  .dl-menu.show{display:block;}
  .dl-menu div{padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .dl-menu div:hover{background:var(--primary-light);color:var(--primary);}

  .mini-stepper{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap;}
  .mini-stepper .step{padding:3px 8px;border-radius:10px;background:#eceff1;color:var(--text-muted);}
  .mini-stepper .step.ok{background:var(--ok-bg);color:var(--ok);}
  .mini-stepper .step.err{background:var(--err-bg);color:var(--err);font-weight:600;}
  .mini-stepper .step.pending{background:#eceff1;color:#9aa4b0;}
  .mini-stepper .arrow{color:#c3cad2;}

  main{padding:22px 32px 60px;max-width:none;margin:0;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:18px;
  }
  .panel h2{font-size:15px;margin:0 0 4px;font-weight:500;}
  .panel .sub{color:var(--text-muted);font-size:12.5px;margin:0 0 16px;line-height:1.5;}
  .tabview{display:none;}
  .tabview.active{display:block;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .search{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);border-radius:20px;padding:6px 12px;background:#fbfbfc;min-width:220px;
  }
  .toolbar .search input{border:none;outline:none;background:none;font-size:13px;flex:1;font-family:inherit;}
  .spacer{flex:1;}

  button.btn{
    font-family:inherit;font-size:12.5px;font-weight:500;
    border-radius:4px;border:1px solid transparent;padding:8px 16px;
    cursor:pointer;letter-spacing:.2px;
  }
  button.btn.primary{background:var(--primary);color:#fff;}
  button.btn.primary:hover{background:var(--primary-dark);}
  button.btn.ghost{background:none;border-color:var(--border);color:var(--text);}
  button.btn.ghost:hover{border-color:var(--primary);color:var(--primary);}
  button.btn.danger-ghost{background:none;border-color:var(--border);color:var(--err);}
  button.btn.danger-ghost:hover{border-color:var(--err);background:var(--err-bg);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.icon-btn{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;
    color:var(--text-muted);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    margin-left:4px;line-height:1;padding:0;
  }
  button.icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
  button.icon-btn.danger:hover{border-color:var(--err);color:var(--err);background:var(--err-bg);}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{
    text-align:left;padding:9px 10px;background:#f7f8fa;color:var(--text-muted);
    font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--border);position:relative;white-space:nowrap;
  }
  table.data th.sortable{cursor:pointer;user-select:none;}
  table.data th.sortable:hover{color:var(--primary);}
  table.data td{padding:9px 10px;border-bottom:1px solid #eef0f2;vertical-align:middle;}
  table.data tbody tr:hover{background:#fafcff;}
  table.data tr.selected{background:var(--primary-light);}
  .col-actions{white-space:nowrap;text-align:right;}

  .chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:500;}
  .chip-x{
    appearance:none;border:none;background:rgba(0,0,0,.08);color:inherit;border-radius:50%;
    width:16px;height:16px;line-height:16px;text-align:center;font-size:12px;cursor:pointer;padding:0;
  }
  .chip-x:hover{background:var(--err);color:#fff;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.err{background:var(--err-bg);color:var(--err);}
  .chip.info{background:var(--info-bg);color:var(--info);}
  .chip.neutral{background:#eceff1;color:#546070;}

  .pagination{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--text-muted);font-size:12.5px;}
  .pagination select{font-family:inherit;font-size:12.5px;border:1px solid var(--border);border-radius:4px;padding:4px 6px;}
  .pagination button{border:1px solid var(--border);background:#fff;border-radius:4px;padding:4px 9px;cursor:pointer;}
  .pagination button:disabled{opacity:.4;cursor:not-allowed;}

  .layout-split{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start;}
  @media(max-width:1000px){.layout-split{grid-template-columns:1fr;}}
  .layout-split-routen{display:grid;grid-template-columns:minmax(0,880px) 1fr;gap:18px;align-items:start;}
  @media(max-width:1300px){.layout-split-routen{grid-template-columns:1fr;}}

  .field-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field-row label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .field-row input[type=text],.field-row input[type=number],.field-row input[type=date],.field-row select{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:4px;outline:none;
  }
  .field-row input:focus,.field-row select:focus{border-color:var(--primary);}
  .field-row.checkbox{flex-direction:row;align-items:center;}
  .field-row.checkbox input{margin-right:8px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .autocomplete{position:relative;}
  .autocomplete .results{
    position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);
    border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:30;display:none;
  }
  .autocomplete .results.show{display:block;}
  .autocomplete .results div{padding:8px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f2f2f2;}
  .autocomplete .results div:hover{background:var(--primary-light);}
  .autocomplete .results div b{color:var(--primary);}

  .radio-group{display:flex;gap:18px;margin-bottom:16px;}
  .radio-option{
    border:1px solid var(--border);border-radius:6px;padding:12px 16px;flex:1;cursor:pointer;
    display:flex;align-items:flex-start;gap:10px;
  }
  .radio-option.selected{border-color:var(--primary);background:var(--primary-light);}
  .radio-option input{margin-top:2px;}
  .radio-option .lbl{font-weight:500;font-size:13px;}
  .radio-option .desc{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .route-header-card{background:#fbfcfe;border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
  .empty-state{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:13px;}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:8px;padding:22px 24px;width:480px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 4px;font-size:15px;}
  .modal .sub{color:var(--text-muted);font-size:12px;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .badge-tab-count{background:#eceff1;color:var(--text-muted);border-radius:10px;padding:1px 7px;font-size:10.5px;margin-left:6px;}
  .note-banner{background:var(--warn-bg);border:1px solid #ffe0b2;color:var(--warn);border-radius:6px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}

  .sub-tabs{display:flex;border-bottom:1px solid var(--border);background:#fbfcfd;}
  .sub-tabs button{
    appearance:none;border:none;background:none;padding:14px 20px;font-size:13px;font-family:inherit;
    color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;
  }
  .sub-tabs button:hover{color:var(--primary);background:var(--primary-light);}
  .sub-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}

  .playlist-groups{display:flex;flex-direction:column;gap:14px;}
  .playlist-group{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .playlist-group-header{
    display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f7f8fa;border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  .playlist-group-nummer{font-weight:600;font-size:13px;}
  .playlist-group-titel{font-weight:500;font-size:12.5px;color:var(--text);}
  .playlist-group-desc{color:var(--text-muted);font-size:12.5px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .playlist-group-table{margin:0;}
  .playlist-group-table th{background:#fff;}

  .errorlog-header{
    display:grid;grid-template-columns:22px 1.6fr 1.1fr 0.8fr 0.9fr 1fr;
    align-items:center;gap:10px;padding:9px 16px;
    background:#f7f8fa;color:var(--text-muted);font-weight:500;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);
  }
  .errorlog-list{display:flex;flex-direction:column;}
  .errorlog-item{border-bottom:1px solid var(--border);background:#fff;}
  .errorlog-item:last-child{border-bottom:none;}
  .errorlog-item.handled{opacity:.7;}
  .errorlog-row{
    display:grid;grid-template-columns:22px 1.6fr 1.1fr 0.8fr 0.9fr 1fr;
    align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-size:13px;
  }
  .errorlog-row:hover{background:#fafbfc;}
  .errorlog-item.open .errorlog-row{background:var(--primary-light);}
  .errorlog-caret{color:#8a94a3;font-size:11px;}
  .errorlog-type{font-weight:500;}
  .errorlog-meta{color:var(--text-muted);font-size:12.5px;}
  .errorlog-link{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.4px;text-align:right;}
  .errorlog-detail{
    padding:16px 20px 20px 48px;background:#fafbfc;border-top:1px solid var(--border);
  }
  .errorlog-detail-text{font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.5;}
  .errorlog-fix{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px 2px;max-width:420px;}
  .errorlog-fix .field-row{margin-bottom:14px;}
  .errorlog-fix .field-row label{font-size:11.5px;}
  .errorlog-fix .field-row input{width:100%;}
  .errorlog-fix .field-grid{max-width:none;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#26313f;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .footer-note{color:var(--text-muted);font-size:11.5px;text-align:center;margin-top:20px;}
</style>
</head>

function sortRows(rows, key, dir){
  return rows.slice().sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(typeof va==='boolean') return (Number(va)-Number(vb))*dir;
    if(va==='' && vb!=='') return 1*dir;
    if(vb==='' && va!=='') return -1*dir;
    return String(va).localeCompare(String(vb),'de',{numeric:true})*dir;
  });
}
function sortArrow(state, col){ return state.key!==col ? '' : `<span style="font-size:10px;margin-left:3px;">${state.dir===1?'▲':'▼'}</span>`; }

/* ============================= HELPERS ============================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}
function openModal(html){
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
}
document.getElementById('modalBackdrop').addEventListener('click',e=>{
  if(e.target.id==='modalBackdrop') closeModal();
});
function statusChip(status){
  const map={
    "routendetection_laeuft":["info","Routenerkennung läuft"],
    "fertig":["ok","Fertig"],
    "neue_routen":["warn","Neue Routen"],
    "fehler":["err","Fehler"],
    "bereit":["ok","Bereit zum Export"],
    "archiv_wird_erstellt":["info","Archiv wird erstellt"],
    "archiv_erstellt":["ok","Archiv erstellt"],
    "upload_laeuft":["info","Upload läuft"],
    "abgeschlossen":["ok","Abgeschlossen"],
  };
  const [cls,label]=map[status]||["neutral",status];
  return `<span class="chip ${cls}">${label}</span>`;
}
function archiveOptions(status, i){
  const r=archiveRows[i];
  const hasError = status==="fehler" || r.hasSkippedError;

  let statusAction = "";
  if(status==="routendetection_laeuft") statusAction = `<button class="btn small ghost" disabled>Routenerkennung läuft…</button>`;
  else if(status==="neue_routen") statusAction = `<button class="btn small primary" onclick="goToRoutenConfig(${i})">Routen konfigurieren</button>`;
  else if(status==="archiv_wird_erstellt") statusAction = `<button class="btn small ghost" disabled>Archiv wird erstellt…</button>`;
  else if(status==="archiv_erstellt") statusAction = `<button class="btn small ghost" disabled>Upload wird gestartet…</button>`;
  else if(status==="upload_laeuft") statusAction = `<button class="btn small ghost" disabled>Upload läuft…</button>`;

  const downloadBtn = `
    <div class="dl-wrap">
      <button class="btn small ghost" onclick="toggleDownloadMenu(${i})">Herunterladen ▾</button>
      <div class="dl-menu" id="dlMenu_${i}">
        <div onclick="downloadArchive(${i},'archiv')">Archiv</div>
        <div onclick="downloadArchive(${i},'gesamt')">Alle Routen</div>
        <div onclick="downloadArchive(${i},'neue_routen')">Neue Routen</div>
      </div>
    </div>
  `;
  const createBtn = (status!=="abgeschlossen" && status!=="neue_routen") ? `<button class="btn small primary" onclick="startArchiveCreation(${i})">Archiv erstellen</button>` : '';

  const errorLink = hasError ? `<button class="btn small danger-ghost" onclick="renderErrorLogModal(${i})">Details ansehen</button>` : '';

  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${downloadBtn}${statusAction}${errorLink}${createBtn}</div>`;
}
function toggleDownloadMenu(i){
  document.querySelectorAll('.dl-menu').forEach(m=>{ if(m.id!=='dlMenu_'+i) m.classList.remove('show'); });
  document.getElementById('dlMenu_'+i).classList.toggle('show');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.dl-wrap')) document.querySelectorAll('.dl-menu').forEach(m=>m.classList.remove('show'));
});
function downloadArchive(i, type){
  document.querySelectorAll('.dl-menu').forEach(m=>m.classList.remove('show'));
  const label = type==='archiv' ? 'Archiv' : type==='gesamt' ? 'Alle Routen' : 'Neue Routen';
  toast(`Download „${label}“ gestartet (Demo)`);
}
function statusCell(r){
  const warn = r.hasSkippedError ? `<span class="chip warn" style="margin-left:6px;" title="Ein externer Fahrplanfehler wurde übersprungen und ist weiterhin offen">⚠ Fehler vorhanden</span>` : '';
  return statusChip(r.status) + warn;
}
function renderErrorLogModal(i){
  const r=archiveRows[i];
  const openErrors=r.errorLog.filter(e=>!e.resolved && !e.skipped);
  openModal(`
    <h3>Error-Log</h3>
    <p class="sub">${r.datum} · ${r.typ} · ${r.parameter}</p>
    <p class="sub" style="margin-bottom:14px;">Die Routenerkennung hat folgende offenen Fehler gefunden:</p>
    ${openErrors.map((e,j)=>`
      <div style="border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;">
        <div style="font-weight:500;font-size:13px;">
          ${e.type}
          ${e.external?' <span class="chip neutral" style="margin-left:4px;">Extern</span>':''}
        </div>
        <div class="sub" style="margin:2px 0 0;">${e.detail}</div>
      </div>
    `).join('')}
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Schließen</button>
    </div>
  `);
}
function jumpToErrorTab(i,j){
  const e=archiveRows[i].errorLog[j];
  closeModal();
  selectTab(e.tab);
  toast(`Zu „${e.tabLabel}“ gesprungen`);
}
function finishErrorHandling(i){
  const r=archiveRows[i];
  r.hasSkippedError = r.errorLog.some(e=>e.skipped);
  r.status='bereit';
  closeModal();
  renderArchiv();
  toast(r.hasSkippedError ? 'Fehler bearbeitet – ein Fahrplanfehler bleibt markiert' : 'Alle Fehler behoben – Status: Abgeschlossen');
}
function goToRoutenConfig(i){
  selectTab('routen');
  if(archiveRows[i] && archiveRows[i].status==='neue_routen'){
    archiveRows[i].status='bereit';
  }
  renderArchiv();
  toast('Zu Routen konfigurieren gesprungen (Demo) – Status: Bereit zum Export');
}
function markRoutesConfigured(i){
  archiveRows[i].status='bereit';
  renderArchiv();
  toast('Routen konfiguriert – Status: Abgeschlossen');
}

function setTyp(t){ selectedTyp=t; renderArchiv(); }
function startArchive(){
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  const isIBIS = selectedTyp==='IBIS';
  const param = isIBIS ? `Zeitraum ${from}–${to}` : 'wartet auf IBIS-Export';
  const now=new Date();
  archiveRows.unshift({
    datum: now.toLocaleDateString('de-DE')+" "+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),
    typ:selectedTyp, status: isIBIS ? 'routendetection_laeuft' : 'archiv_wird_erstellt', parameter: param
  });
  renderArchiv();
  toast(isIBIS ? 'Routenerkennung gestartet (Demo)' : 'Archiverstellung gestartet (Demo)');
  const idx=0;
  if(isIBIS){
    setTimeout(()=>{
      const outcomes=['fertig','neue_routen','fehler'];
      const outcome=outcomes[Math.floor(Math.random()*outcomes.length)];
      archiveRows[idx].status=outcome;
      if(outcome==='fehler'){
        archiveRows[idx].errorLog=[
          {type:"Missing Distances", detail:"Route 56.104: Distanz zwischen zwei Stationen fehlt.", external:false, resolved:false, skipped:false, tab:"routen", tabLabel:"Routen"},
          {type:"Missing LineNumber", detail:"Route 56.135: Liniennummer ist nicht gesetzt.", external:false, resolved:false, skipped:false, tab:"zielcodes", tabLabel:"Zielcodes"},
          {type:"Missing Station Coordinates", detail:"Eine Station hat keine GPS-Koordinaten.", external:false, resolved:false, skipped:false, tab:"stationen", tabLabel:"Stationen"},
          {type:"Missing Schedule Data", detail:"Fahrplan-Release: Abfahrtszeiten unvollständig.", external:true, resolved:false, skipped:false, tab:null, tabLabel:null},
          {type:"Missing Announcement", detail:"Eine Station hat keine Ansage zugeordnet.", external:false, resolved:false, skipped:false, tab:"playlist", tabLabel:"Playlist bearbeiten"},
        ];
      }
      renderArchiv();
      toast('Routenerkennung abgeschlossen: '+(outcome==='fertig'?'Fertig – keine neuen Routen':outcome==='neue_routen'?'Neue Routen erkannt':'Fehler erkannt'));
    }, 1800);
  } else {
    setTimeout(()=>{ archiveRows[idx].status='archiv_erstellt'; renderArchiv(); }, 1400);
    setTimeout(()=>{ archiveRows[idx].status='upload_laeuft'; renderArchiv(); }, 2400);
    setTimeout(()=>{ archiveRows[idx].status='abgeschlossen'; renderArchiv(); toast('Upload erfolgreich – Archiv abgeschlossen'); }, 3600);
  }
}
function startArchiveCreation(i){
  const r=archiveRows[i];
  if(r.status==="fehler" && r.errorLog){
    const open=r.errorLog.filter(e=>!e.resolved && !e.skipped);
    if(open.length===1 && open[0].type==="Missing Schedule Data"){
      confirmCreateDespiteSchedule(i);
      return;
    }
    if(open.length>0){
      toast('Bitte zuerst die offenen Fehler im Error-Log beheben');
      return;
    }
  }
  actuallyStartArchiveCreation(i);
}
function confirmCreateDespiteSchedule(i){
  openModal(`
    <h3>Trotzdem Archiv erstellen?</h3>
    <p class="sub">Der einzige offene Punkt ist „Missing Schedule Data" — dieser wird extern verwaltet und kann hier nicht korrigiert werden. Möchten Sie das Archiv trotzdem erstellen? Der Fahrplan-Hinweis bleibt danach weiterhin sichtbar markiert.</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="confirmCreateDespiteScheduleYes(${i})">Ja, Archiv trotzdem erstellen</button>
    </div>
  `);
}
function confirmCreateDespiteScheduleYes(i){
  const r=archiveRows[i];
  r.hasSkippedError=true;
  r.errorLog.forEach(e=>{ if(e.type==="Missing Schedule Data") e.skipped=true; });
  closeModal();
  actuallyStartArchiveCreation(i);
}
function actuallyStartArchiveCreation(i){
  archiveRows[i].status='archiv_wird_erstellt';
  renderArchiv();
  toast('Archiv wird erstellt (Demo)');
  setTimeout(()=>{ archiveRows[i].status='archiv_erstellt'; renderArchiv(); toast('Archiv erstellt – Upload wird gestartet'); }, 1400);
  setTimeout(()=>{ archiveRows[i].status='upload_laeuft'; renderArchiv(); }, 2400);
  setTimeout(()=>{ archiveRows[i].status='abgeschlossen'; renderArchiv(); toast('Upload erfolgreich – Archiv abgeschlossen'); }, 3600);
}
renderArchiv();

function renderPlaylist(){
  const el=document.getElementById('view-playlist');
  const groups=groupedPlaylist();
  el.innerHTML=`
    <div class="panel">
      <h2>Playlist bearbeiten</h2>
      <p class="sub">Ansagenummer (sbr.announcements) oder Funktionsansage/Notfall (sbr.announcement_list, feste Nummer) — Reihenfolge der Fragmente je Nummer über sbr.playlist.</p>
      <div class="toolbar"><div class="spacer"></div><button class="btn primary" onclick="openPlaylistComposeDialog()">+ Zu Playlist hinzufügen</button></div>
      ${groups.length===0 ? `<div class="empty-state">Noch keine Playlist-Einträge.</div>` : `
      <div style="overflow-x:auto;">
      <table class="data" style="min-width:900px;">
        <thead><tr>
          <th>Ansagenummer</th><th>Beschreibung (255 Zeichen möglich)</th><th>Fragmente</th><th style="width:110px;">Funktionsansage</th><th class="col-actions"></th>
        </tr></thead>
        <tbody>
          ${groups.map(g=>{
            const checked = g.typ!=='Ansage';
            return `
              <tr>
                <td><b>${g.nummer}</b></td>
                <td>${g.titel||g.combinedBeschreibung||'—'}</td>
                <td>
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    ${g.items.map(it=>`
                      <span class="chip neutral" style="display:inline-flex;align-items:center;gap:6px;">
                        ${it.fragment} · ${it.filename}
                        <button class="chip-x" title="Fragment entfernen" onclick="removeFragmentFromCombo(${it.idx})">×</button>
                      </span>
                    `).join('')}
                  </div>
                </td>
                <td style="text-align:center;"><input type="checkbox" disabled ${checked?'checked':''}></td>
                <td class="col-actions">
                  <button class="icon-btn" title="Bearbeiten" onclick="editPlaylistCombo('${g.nummer.replace(/'/g,"\\'")}','${g.typ}')">✎</button>
                  <button class="icon-btn danger" title="Ganze Kombination löschen" onclick="deletePlaylistCombo('${g.nummer.replace(/'/g,"\\'")}','${g.typ}')">🗑</button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
      `}
    </div>
  `;
}
function groupedPlaylist(){
  const groups={};
  playlistRows.forEach((p,idx)=>{
    const key=p.nummer+'|'+p.typ;
    if(!groups[key]) groups[key]={nummer:p.nummer, typ:p.typ, titel:p.titel||'', items:[]};
    groups[key].items.push({...p, idx});
  });
  return Object.values(groups).map(g=>{
    g.items.sort((a,b)=>a.fragment-b.fragment);
    g.combinedBeschreibung = g.items.map(it=>it.beschreibung||it.filename).join(' → ');
    return g;
  });
}
function deletePlaylistCombo(nummer, typ){
  playlistRows = playlistRows.filter(p=>!(p.nummer===nummer && p.typ===typ));
  renderAudiodateien(); renderPlaylist();
  toast('Kombination gelöscht');
}
function removeFragmentFromCombo(idx){
  const removed=playlistRows[idx];
  playlistRows.splice(idx,1);
  playlistRows.filter(p=>p.nummer===removed.nummer && p.typ===removed.typ)
    .sort((a,b)=>a.fragment-b.fragment)
    .forEach((p,i)=>{ p.fragment=i+1; });
  renderAudiodateien(); renderPlaylist();
  toast('Fragment aus Kombination entfernt');
}
function openAudioUploadDialog(){
  openModal(`
    <h3>Audio hochladen</h3>
    <p class="sub">Erster Schritt: Audiodatei hochladen. Die Zuordnung zu einer Ansagenummer erfolgt danach in der Playlist.</p>
    <div class="field-row"><label>Datei</label><input type="file" id="audioFile" accept="audio/*"></div>
    <div class="field-row">
      <label>Dateiname-Modus</label>
      <select id="audioMode" onchange="toggleAudioModeFields()" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit;">
        <option value="new">Neuer eindeutiger Dateiname</option>
        <option value="existing">Bestehenden Dateinamen ersetzen</option>
      </select>
    </div>
    <div class="field-row" id="existingFilenameRow" style="display:none;">
      <label>Bestehende Datei</label>
      <select id="audioExistingFile" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit;">
        ${audioFragmentsRows.map(a=>`<option value="${a.filename}">${a.filename}</option>`).join('')}
      </select>
      <div class="hint">Hinweis: Ob das Ersetzen automatisch ein neues Audioarchiv auslöst, ist noch nicht entschieden (Demo ohne Auswirkung).</div>
    </div>
    <div class="field-row"><label>Beschreibung</label><input type="text" id="audioBeschreibung" placeholder="z. B. Türfreigabe-Ansage"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="confirmAudioUpload()">Hochladen</button>
    </div>
  `);
}
function toggleAudioModeFields(){
  const mode=document.getElementById('audioMode').value;
  document.getElementById('existingFilenameRow').style.display = mode==='existing' ? 'block' : 'none';
}
function formatBytes(bytes){
  if(!bytes && bytes!==0) return '—';
  if(bytes<1024) return bytes+' B';
  return Math.round(bytes/1024)+' KB';
}
function confirmAudioUpload(){
  const fileInput=document.getElementById('audioFile');
  const mode=document.getElementById('audioMode').value;
  const beschreibung=document.getElementById('audioBeschreibung').value || '';
  const now=new Date().toLocaleDateString('de-DE');
  const chosenFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
  if(mode==='existing'){
    const filename=document.getElementById('audioExistingFile').value;
    const idx=audioFragmentsRows.findIndex(a=>a.filename===filename);
    if(idx>-1){
      audioFragmentsRows[idx]={
        fragmentNummer: audioFragmentsRows[idx].fragmentNummer,
        filename,
        beschreibung: beschreibung||audioFragmentsRows[idx].beschreibung,
        uploaded:now,
        groesse: chosenFile ? formatBytes(chosenFile.size) : audioFragmentsRows[idx].groesse,
      };
    }
    closeModal(); renderAudiodateien(); renderPlaylist();
    toast('Bestehende Datei ersetzt (Demo): '+filename);
  } else {
    const filename = chosenFile ? chosenFile.name : 'neue_datei_'+(audioFragmentsRows.length+1)+'.mp3';
    const fragmentNummer = nextFragmentNummer();
    const groesse = chosenFile ? formatBytes(chosenFile.size) : (Math.round(40+Math.random()*100))+' KB';
    audioFragmentsRows.unshift({fragmentNummer, filename, beschreibung, uploaded:now, groesse});
    closeModal(); renderAudiodateien(); renderPlaylist();
    toast('Audio hochgeladen (Demo): '+filename);
  }
}
function nextFragmentNummer(){
  const nums=audioFragmentsRows.map(a=>parseInt(a.fragmentNummer)||0);
  return String((nums.length?Math.max(...nums):0)+1);
}
function deleteAudioFragment(i){ audioFragmentsRows.splice(i,1); renderAudiodateien(); renderPlaylist(); toast('Audiofragment gelöscht'); }
function editAudioFragment(i){
  const a=audioFragmentsRows[i];
  openModal(`
    <h3>Audiofragment bearbeiten</h3>
    <div class="field-row"><label>Fragmentnummer</label><input type="text" id="ea_fragmentNummer" value="${a.fragmentNummer}"></div>
    <div class="field-row"><label>Dateiname</label><input type="text" id="ea_filename" value="${a.filename}"></div>
    <div class="field-row">
      <label>Neue MP3 hochladen (ersetzt aktuelle Datei)</label>
      <input type="file" id="ea_file" accept="audio/*" onchange="if(this.files[0]){ document.getElementById('ea_filename').value=this.files[0].name; document.getElementById('ea_groesse').value=formatBytes(this.files[0].size); }">
      <div class="hint">Optional — leer lassen, um die bestehende Datei zu behalten.</div>
    </div>
    <div class="field-row"><label>Größe</label><input type="text" id="ea_groesse" value="${a.groesse||''}"></div>
    <div class="field-row"><label>Beschreibung</label><input type="text" id="ea_beschreibung" value="${a.beschreibung||''}"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="saveAudioFragment(${i})">Speichern</button>
    </div>
  `);
}
function saveAudioFragment(i){
  const oldFilename=audioFragmentsRows[i].filename;
  const fileInput=document.getElementById('ea_file');
  const uploadedName = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : null;
  const newFilename=uploadedName || document.getElementById('ea_filename').value;
  audioFragmentsRows[i].fragmentNummer=document.getElementById('ea_fragmentNummer').value;
  audioFragmentsRows[i].filename=newFilename;
  audioFragmentsRows[i].groesse=document.getElementById('ea_groesse').value;
  audioFragmentsRows[i].beschreibung=document.getElementById('ea_beschreibung').value;
  if(uploadedName) audioFragmentsRows[i].uploaded=new Date().toLocaleDateString('de-DE');
  playlistRows.forEach(p=>{ if(p.filename===oldFilename) p.filename=newFilename; });
  closeModal();
  renderAudiodateien(); renderPlaylist();
  toast(uploadedName ? 'Neue MP3 hochgeladen und gespeichert (Demo): '+newFilename : 'Audiofragment gespeichert');
}
let composeFragments = [];
let composeEditKey = null;
let composeTitel = '';
function openPlaylistComposeDialog(){
  composeFragments = [{filename:'', beschreibung:''}];
  composeEditKey = null;
  composeTitel = '';
  renderComposeDialog();
}
function renderComposeDialog(){
  openModal(`
    <h3>${composeEditKey ? 'Kombination bearbeiten' : 'Zu Playlist hinzufügen'}</h3>
    <p class="sub">Mehrere Audiofragmente zu einer Kombination (Ansage oder Funktionsansage) zusammenstellen. Reihenfolge = Fragment-Position.</p>
    <div class="field-row">
      <label>Typ</label>
      <select id="pl_typ" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;font-family:inherit;">
        <option value="Ansage">Ansage (sbr.announcements)</option>
        <option value="Funktionsansage">Funktionsansage (sbr.announcement_list — feste Nummer)</option>
        <option value="Notfall">Notfall (sbr.announcement_list — Notfallansage, feste Nummer)</option>
      </select>
    </div>
    <div class="field-row"><label>Nummer</label><input type="text" id="pl_nummer" placeholder="z. B. 9.941 oder 110.001"></div>
    <div class="field-row"><label>Titel (Hinweis)</label><input type="text" id="pl_titel" value="${composeTitel||''}" placeholder="z. B. Türfreigabe Dunantstraße"></div>
    <p class="sub" style="margin:14px 0 8px;">Fragmente in Reihenfolge</p>
    ${composeFragments.map((f,idx)=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="width:20px;color:#8a94a3;font-size:12px;">${idx+1}.</span>
        <div class="autocomplete" style="flex:1;">
          <input type="text" id="pl_frag_${idx}" value="${f.filename}" placeholder="Audiofragment suchen…" oninput="showFragmentResults(${idx}, this.value)" onfocus="showFragmentResults(${idx}, this.value)">
          <div class="results" id="fragmentResults_${idx}"></div>
        </div>
        ${composeFragments.length>1?`<button class="icon-btn danger" title="Entfernen" onclick="removeComposeFragment(${idx})">🗑</button>`:''}
      </div>
    `).join('')}
    <button class="btn ghost small" onclick="addComposeFragment()">+ Weiteres Fragment</button>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="confirmPlaylistCompose()">${composeEditKey ? 'Speichern' : 'Kombination hinzufügen'}</button>
    </div>
  `);
}
function addComposeFragment(){
  const typ=document.getElementById('pl_typ')?.value;
  const nummer=document.getElementById('pl_nummer')?.value;
  composeFragments.push({filename:'', beschreibung:''});
  renderComposeDialog();
  if(typ) document.getElementById('pl_typ').value=typ;
  if(nummer) document.getElementById('pl_nummer').value=nummer;
}
function removeComposeFragment(idx){
  const typ=document.getElementById('pl_typ')?.value;
  const nummer=document.getElementById('pl_nummer')?.value;
  composeFragments.splice(idx,1);
  renderComposeDialog();
  if(typ) document.getElementById('pl_typ').value=typ;
  if(nummer) document.getElementById('pl_nummer').value=nummer;
}
function showFragmentResults(idx, q){
  const box=document.getElementById('fragmentResults_'+idx);
  const matches=audioFragmentsRows.filter(a=>a.filename.toLowerCase().includes((q||'').toLowerCase())||(a.beschreibung||'').toLowerCase().includes((q||'').toLowerCase()));
  box.innerHTML=matches.map(a=>`<div onclick="pickFragment(${idx},'${a.filename.replace(/'/g,"\\'")}')"><b>${a.filename}</b> — ${a.beschreibung||''}</div>`).join('') || `<div style="color:#9aa4b0">Keine Treffer — bitte zuerst hochladen</div>`;
  box.classList.add('show');
}
function pickFragment(idx, filename){
  composeFragments[idx].filename=filename;
  document.getElementById('pl_frag_'+idx).value=filename;
  document.getElementById('fragmentResults_'+idx).classList.remove('show');
}
function confirmPlaylistCompose(){
  const typ=document.getElementById('pl_typ').value;
  const nummer=document.getElementById('pl_nummer').value;
  const titel=document.getElementById('pl_titel').value;
  const filenames=composeFragments.map((f,idx)=>document.getElementById('pl_frag_'+idx).value).filter(v=>v);
  if(!nummer||filenames.length===0){ toast('Bitte Nummer und mindestens ein Audiofragment angeben'); return; }
  if(composeEditKey){
    const [oldNummer, oldTyp]=composeEditKey.split('|');
    playlistRows = playlistRows.filter(p=>!(p.nummer===oldNummer && p.typ===oldTyp));
  }
  filenames.forEach((filename,idx)=>{
    const frag=audioFragmentsRows.find(a=>a.filename===filename);
    playlistRows.push({nummer, typ, fragment: idx+1, filename, beschreibung: frag?frag.beschreibung:'', titel});
  });
  closeModal();
  renderAudiodateien(); renderPlaylist();
  toast(composeEditKey ? 'Kombination gespeichert' : `Kombination mit ${filenames.length} Fragment(en) zur Playlist hinzugefügt (Demo)`);
  composeEditKey = null;
}
function deletePlaylistRow(i){ playlistRows.splice(i,1); renderAudiodateien(); renderPlaylist(); toast('Fragment gelöscht'); }
function editPlaylistCombo(nummer, typ){
  const items=playlistRows.filter(p=>p.nummer===nummer && p.typ===typ).sort((a,b)=>a.fragment-b.fragment);
  composeFragments = items.map(it=>({filename:it.filename, beschreibung:it.beschreibung}));
  composeEditKey = nummer+'|'+typ;
  composeTitel = items[0] ? (items[0].titel||'') : '';
  renderComposeDialog();
  document.getElementById('pl_typ').value=typ;
  document.getElementById('pl_nummer').value=nummer;
}
renderAudiodateien(); renderPlaylist();

/* ============================= TAB 8: ZIELCODES DISPO ============================= */
function renderDispo(){
  const el=document.getElementById('view-dispo');
  const q=(document.getElementById('dispoSearch')?.value||'').toLowerCase();
  const rows=dispoRows.filter((r,i)=> r.linie.toLowerCase().includes(q)||r.ziel.toLowerCase().includes(q)||r.code.includes(q));
  el.innerHTML=`
    <div class="panel">
      <h2>Zielcodes für Dispositionsmaßnahmen</h2>
      <p class="sub">Wird von vehicle_interface genutzt, wenn sich der ursprüngliche Zielcode durch eine dispositive Änderung ändert. Ca. 30.000 Zeilen, alle Spalten editierbar.</p>
      <div class="toolbar">
        <div class="search autocomplete">🔎 <input id="dispoSearch" placeholder="Suche Linie, Ziel, Code…" oninput="renderDispo();showDispoSuggest(this.value)" onfocus="showDispoSuggest(this.value)">
          <div class="results" id="dispoSuggest"></div>
        </div>
        <div class="spacer"></div>
        <button class="btn primary" onclick="editDispo(null)">+ Neuer Eintrag</button>
      </div>
      <table class="data">
        <thead><tr><th>Gattung</th><th>Linie</th><th>Zielstation</th><th>Zielcode</th><th class="col-actions"></th></tr></thead>
        <tbody>
        ${rows.map((r)=>`
          <tr>
            <td>${r.gattung}</td><td>${r.linie}</td><td>${r.ziel}</td><td>${r.code}</td>
            <td class="col-actions">
              <button class="icon-btn" title="Bearbeiten" onclick="editDispo(${dispoRows.indexOf(r)})">✎</button>
              <button class="icon-btn danger" title="Löschen" onclick="deleteDispo(${dispoRows.indexOf(r)})">🗑</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="pagination">Zeile 1–${rows.length} von ca. 30.000
        <select><option>25 / Seite</option><option>50 / Seite</option></select>
        <button disabled>‹</button><button>›</button>
      </div>
    </div>
  `;
}
function editDispo(i){
  const r = i===null ? {gattung:"S",linie:"",ziel:"",code:""} : dispoRows[i];
  openModal(`
    <h3>${i===null?'Neuer Eintrag':'Eintrag bearbeiten'}</h3>
    <div class="field-row">
      <label>Gattung</label>
      <select id="d_gattung"><option ${r.gattung==='S'?'selected':''}>S</option><option ${r.gattung==='E'?'selected':''}>E</option></select>
    </div>
    <div class="field-row"><label>Linie</label><input type="text" id="d_linie" value="${r.linie}"></div>
    <div class="field-row"><label>Zielstation</label><input type="text" id="d_ziel" value="${r.ziel}"></div>
    <div class="field-row">
      <label>Zielcode</label>
      <div class="autocomplete">
        <input type="text" id="d_code" value="${r.code}" oninput="showZielResults('dispoZielResults', this.value)" onfocus="showZielResults('dispoZielResults', this.value)">
        <div class="results" id="dispoZielResults"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="saveDispo(${i===null?'null':i})">Speichern</button>
    </div>
  `);
}
function saveDispo(i){
  const data={
    gattung:document.getElementById('d_gattung').value,
    linie:document.getElementById('d_linie').value,
    ziel:document.getElementById('d_ziel').value,
    code:document.getElementById('d_code').value.split(' – ')[0],
  };
  if(i===null || i==='null') dispoRows.unshift(data); else dispoRows[i]=data;
  closeModal(); renderDispo(); toast('Eintrag gespeichert');
}
function deleteDispo(i){ dispoRows.splice(i,1); renderDispo(); toast('Eintrag gelöscht'); }
renderDispo();

/* ============================= TAB 9: PARAMETER ============================= */
function renderParameter(){
  const el=document.getElementById('view-parameter');
  const q=(document.getElementById('paramSearch')?.value||'').toLowerCase();
  const rows=parameterRows.filter(r=>r.name.toLowerCase().includes(q));
  el.innerHTML=`
    <div class="panel">
      <h2>Parameterarchiv</h2>
      <p class="sub">Konfiguration der INIT-Fahrzeugsoftware-Parameter. Jedes neue Software-Release kann neue Parameter oder Werte mitbringen; nicht alle sind durch AVG editierbar.</p>
      <div class="toolbar"><div class="search autocomplete">🔎 <input id="paramSearch" placeholder="Parameter suchen…" oninput="renderParameter();showParamSuggest(this.value)" onfocus="showParamSuggest(this.value)">
        <div class="results" id="paramSuggest"></div>
      </div></div>
      <table class="data">
        <thead><tr><th>Parameter</th><th>Wert</th><th>Editierbar</th><th>Release</th><th class="col-actions"></th></tr></thead>
        <tbody>
        ${rows.map(r=>`
          <tr>
            <td><code>${r.name}</code></td>
            <td>${r.editable ? `<input type="text" value="${r.wert}" style="width:90px" onchange="updateParam('${r.name}', this.value)">` : r.wert}</td>
            <td>${r.editable?'<span class="chip ok">Ja</span>':'<span class="chip neutral">Nein</span>'}</td>
            <td>${r.release}</td>
            <td class="col-actions">${r.editable?`<button class="icon-btn" title="Speichern" onclick="toast('Parameter gespeichert')">💾</button>`:''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function updateParam(name, val){
  const p=parameterRows.find(r=>r.name===name);
  p.wert=val;
}
renderParameter();

/* ============================= SUCH-VORSCHLÄGE (alle Suchfelder) ============================= */
function renderSuggestBox(boxId, items, query){
  const box=document.getElementById(boxId);
  if(!box) return;
  const q=(query||'').trim();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const shown=items.slice(0,8);
  box.innerHTML = shown.length ? shown.join('') : `<div style="color:#9aa4b0">Keine Treffer</div>`;
  box.classList.add('show');
}
function showRouteSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=routesList.filter(r=>r.idRoute.includes(query)||r.bezeichnung.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickRouteSuggest('${r.idRoute}')"><b>${r.idRoute}</b> — ${r.bezeichnung}</div>`);
  renderSuggestBox('routeSuggest', matches, q);
}
function pickRouteSuggest(idRoute){
  document.getElementById('routeSearch').value=idRoute;
  document.getElementById('routeSuggest').classList.remove('show');
  renderRouten();
}
function showStationSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=stationenRows.filter(r=>r.id.toLowerCase().includes(query)||r.name.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickStationSuggest('${r.id}')"><b>${r.id}</b> — ${r.name}</div>`);
  renderSuggestBox('stationSuggest', matches, q);
}
function pickStationSuggest(id){
  document.getElementById('stationSearch').value=id;
  document.getElementById('stationSuggest').classList.remove('show');
  renderStationen();
}
function showZcSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=zielcodeRows.filter(r=>r.code.includes(query)||r.zielText.toLowerCase().includes(query)||r.linieText.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickZcSuggest('${r.code}')"><b>${r.code}</b> — ${r.linieText} · ${r.zielText}</div>`);
  renderSuggestBox('zcSuggest', matches, q);
}
function pickZcSuggest(code){
  document.getElementById('zcSearch').value=code;
  document.getElementById('zcSuggest').classList.remove('show');
  renderZielcodes();
}
function showLongSuggest(viewId, q){
  const map = viewId==='view-zieltexte' ? zieltexteRows : linientexteRows;
  const query=(q||'').toLowerCase();
  const matches=map.filter(r=>r.nummer.includes(query)||(r.text||'').toLowerCase().includes(query)).slice(0,50)
    .map(r=>`<div onclick="pickLongSuggest('${viewId}','${r.nummer}')"><b>${r.nummer}</b> — ${r.text||'— leer —'}</div>`);
  renderSuggestBox(viewId+'_suggest', matches, q);
}
function pickLongSuggest(viewId, nummer){
  document.getElementById(viewId+'_search').value=nummer;
  document.getElementById(viewId+'_suggest').classList.remove('show');
  if(viewId==='view-zieltexte') renderZieltexte(); else renderLinientexte();
}
function showDispoSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=dispoRows.filter(r=>r.linie.toLowerCase().includes(query)||r.ziel.toLowerCase().includes(query)||r.code.includes(query))
    .map(r=>`<div onclick="pickDispoSuggest('${r.code}')"><b>${r.code}</b> — ${r.linie} · ${r.ziel}</div>`);
  renderSuggestBox('dispoSuggest', matches, q);
}
function pickDispoSuggest(code){
  document.getElementById('dispoSearch').value=code;
  document.getElementById('dispoSuggest').classList.remove('show');
  renderDispo();
}
function showParamSuggest(q){
  const query=(q||'').toLowerCase();
  const matches=parameterRows.filter(r=>r.name.toLowerCase().includes(query))
    .map(r=>`<div onclick="pickParamSuggest('${r.name}')">${r.name}</div>`);
  renderSuggestBox('paramSuggest', matches, q);
}
function pickParamSuggest(name){
  document.getElementById('paramSearch').value=name;
  document.getElementById('paramSuggest').classList.remove('show');
  renderParameter();
}
</script>
